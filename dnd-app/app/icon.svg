<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <!--
    The tab icon: the d20 from the reference art, redrawn as vectors.

    Pointy-topped hexagon, ten faces, heavy black edges, and a 20 on the
    face you are looking at. Lit from the upper right, so the palest
    faces are top-right and the deepest is the bottom-left corner.

    Nine points, eighteen edges, ten faces. The nine are the hexagon's
    six corners plus the three of the centre face; every edge below is
    one of those pairs, and every face is a triangle of three of them.

    The 20 is drawn as PATHS, not as text. A favicon is rendered by the
    browser with whatever font it feels like, and a <text> element in
    one is a different shape on every machine — including no shape at
    all where the family does not resolve.

    NOTE: no double hyphen anywhere in this comment. XML forbids one
    inside a comment body, and an earlier version of this file put a
    CSS variable's name here and stopped parsing entirely while every
    text-matching check on it still passed. The guard parses it now.

    No background plate, matching the reference: the die is the icon.
    That means it no longer borrows the app's gold, so nothing here is
    checked against the palette any more.

    At 16px the faceting is below a pixel and what survives is the
    hexagon and its dark edges, which is the shape people recognise.
  -->
  <g
    stroke="#1a1a1a"
    stroke-width="1.15"
    stroke-linejoin="round"
    stroke-linecap="round"
  >
    <!-- Upper right, catching the most light. -->
    <path fill="#ffc2ce" d="M16 0.5 16 7.4 29.42 8.25Z" />
    <path fill="#ffb3c2" d="M16 7.4 23.45 20.3 29.42 8.25Z" />
    <path fill="#ffa8b9" d="M29.42 8.25 23.45 20.3 29.42 23.75Z" />
    <!-- Upper left. -->
    <path fill="#ff97ab" d="M16 0.5 2.58 8.25 16 7.4Z" />
    <path fill="#ff8aa1" d="M2.58 8.25 8.55 20.3 16 7.4Z" />
    <!-- The face you are looking at, with the 20 on it. -->
    <path fill="#ff7d95" d="M16 7.4 8.55 20.3 23.45 20.3Z" />
    <!-- Lower right. -->
    <path fill="#fb6b85" d="M23.45 20.3 29.42 23.75 16 31.5Z" />
    <path fill="#f45c78" d="M8.55 20.3 23.45 20.3 16 31.5Z" />
    <!-- Lower left, furthest from the light. -->
    <path fill="#ea4d6c" d="M2.58 8.25 2.58 23.75 8.55 20.3Z" />
    <path fill="#e04664" d="M8.55 20.3 2.58 23.75 16 31.5Z" />
  </g>
  <!-- The 20, in the same ink as the edges but drawn thinner so the
       digits stay open at small sizes rather than filling in. -->
  <g
    fill="none"
    stroke="#1a1a1a"
    stroke-width="1.05"
    stroke-linejoin="round"
    stroke-linecap="round"
  >
    <path d="M11.75 15C11.75 13.95 12.8 13.35 13.85 13.35 14.95 13.35 15.8 14.05 15.8 15.05 15.8 16.6 14 17.6 11.75 19.3H15.95" />
    <path d="M18.75 13.35C19.75 13.35 20.5 14.1 20.5 15.1V17.55C20.5 18.55 19.75 19.3 18.75 19.3 17.75 19.3 17 18.55 17 17.55V15.1C17 14.1 17.75 13.35 18.75 13.35Z" />
  </g>
</svg>
