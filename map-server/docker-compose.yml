# Battle map server stack for the PowerEdge.
#
# No `version:` key — Compose v2 ignores it and warns that it is
# obsolete, which is a confusing first thing to see on a fresh install.
# - cloudflared: outbound tunnel to Cloudflare (no router ports opened)
# - caddy: static file server for the map library
# - recorder-api: receives session audio from the browser, in slices
# - recorder-worker: transcribes it with WhisperX and posts it to Convex
#
# Put TUNNEL_TOKEN=<your token> in a .env file next to this compose file.
#
# The two host paths below are on the PowerEdge's media array rather than
# its system disk: /srv is a handful of GB, and the map library is the
# part of this that grows without limit. Only the container-side paths
# (/srv/originals, /srv/web) are fixed — the Caddyfile refers to those,
# so moving to another disk later is a change to these two lines and a
# `docker compose up -d`, and nothing else.

services:
  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: maps-cloudflared
    restart: unless-stopped
    command: tunnel --no-autoupdate run --token ${TUNNEL_TOKEN}
    networks:
      - maps
    depends_on:
      - caddy

  caddy:
    image: caddy:2-alpine
    container_name: maps-caddy
    restart: unless-stopped
    networks:
      - maps
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      # Full-resolution originals (read-only to the container)
      - /mnt/Media/game-mastery/maps:/srv/originals:ro
      # Web-resolution copies generated by make-webres.sh, plus the
      # Foundry artwork mirror under foundry/
      - /mnt/Media/game-mastery/maps-web:/srv/web:ro
      - caddy_data:/data
      - caddy_config:/config

  # ---- the session recorder ---------------------------------------
  #
  # Two containers from one image. The endpoint has to answer while a
  # session is being recorded; the worker is flat out for hours at a
  # time. Together in one process, a transcription that falls over
  # takes the uploads with it, in the middle of the game.
  #
  # Session audio goes on the media array beside the maps for the same
  # reason the maps are there: /srv is a few gigabytes and four hours
  # of a session is sixty megabytes, every fortnight, for ever.
  recorder-api:
    build: ./recorder
    image: game-mastery-recorder:latest
    container_name: maps-recorder-api
    restart: unless-stopped
    env_file: .env
    networks:
      - maps
    volumes:
      - /mnt/Media/game-mastery/sessions:/data/sessions

  recorder-worker:
    build: ./recorder
    image: game-mastery-recorder:latest
    container_name: maps-recorder-worker
    restart: unless-stopped
    command: ["python", "worker.py"]
    env_file: .env
    networks:
      - maps
    volumes:
      - /mnt/Media/game-mastery/sessions:/data/sessions
      # The model weights, which are gigabytes and are downloaded on
      # first use. Without this volume every restart re-downloads
      # large-v3 before it transcribes anything.
      - recorder_models:/root/.cache
    depends_on:
      - recorder-api

networks:
  maps:
    driver: bridge

volumes:
  caddy_data:
  caddy_config:
  recorder_models:
