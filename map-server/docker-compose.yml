# Battle map server stack for the PowerEdge.
#
# No `version:` key — Compose v2 ignores it and warns that it is
# obsolete, which is a confusing first thing to see on a fresh install.
# - cloudflared: outbound tunnel to Cloudflare (no router ports opened)
# - caddy: static file server for the map library
#
# Put TUNNEL_TOKEN=<your token> in a .env file next to this compose file.
# Adjust the two volume paths on the caddy service to wherever your map
# library actually lives on the server.

services:
  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: maps-cloudflared
    restart: unless-stopped
    command: tunnel --no-autoupdate run --token ${TUNNEL_TOKEN}
    networks:
      - maps
    depends_on:
      - caddy

  caddy:
    image: caddy:2-alpine
    container_name: maps-caddy
    restart: unless-stopped
    networks:
      - maps
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      # Full-resolution originals (read-only to the container)
      - /srv/maps:/srv/originals:ro
      # Web-resolution copies generated by make-webres.sh
      - /srv/maps-web:/srv/web:ro
      - caddy_data:/data
      - caddy_config:/config

networks:
  maps:
    driver: bridge

volumes:
  caddy_data:
  caddy_config:
