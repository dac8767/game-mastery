# Per-repo settings for finish-worktree.sh, catchup-worktrees.sh and
# merge-worktrees.sh.
# The scripts themselves are identical in every repo; this file is the
# only thing that differs. It is sourced by zsh, so quote the values.

# Run in the worktree before merging; must exit 0 for the merge to
# happen. Empty means no check.
check='cd dnd-app && npm run guards'

# A file that, when a rebase changes it, means dependencies moved and
# `install` should run in that worktree. Empty means never.
lockfile='dnd-app/package-lock.json'
install='cd dnd-app && npm install --no-audit --no-fund --silent'

# Conflicts the scripts may settle on their own when a rebase stops. One rule
# a line: the path, then how, then (for `theirs`) a pattern every conflicted
# line must match or the conflict is real and the scripts stop as before.
#   union   keep both sides' lines. For append-only logs, where two branches
#           each wrote a new entry at the same spot and either order is fine.
#   theirs  take the branch's side of the hunk. For a literal every branch
#           rewrites and whose value on the branch is the one that should
#           survive its own rebase.
# Empty here: this repo has no file every branch collides on by design yet.
# soul-harvest's conf is the worked example (its measurement log and its
# build stamp). Add a rule the first time the same conflict stops a merge
# twice.
autoresolve=(
)
